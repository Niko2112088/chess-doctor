name: Chess Doctor CI

on:
  push:
    branches: [main, "setup/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-doctor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        version: [v050, v060, v061]
    env:
      APP_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/static-files.cjs
      - run: node tests/contract-tests.cjs
      - run: node tests/engine-smoke.cjs
      - run: node tests/qa.cjs

  learning:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: v061
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/library.cjs
      - run: node tests/master-analysis.cjs

  browser:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: v061
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 3
